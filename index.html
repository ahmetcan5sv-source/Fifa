<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA Ligi</title>
<style>
:root{--bg:#0b1511;--card:#12211a;--line:#1f3a2d;--txt:#eef3ee;--mut:#86a091;--acc:#f2c14e;--ok:#5dd28a;--bad:#ef6a5e}
*{box-sizing:border-box}
body{margin:auto;background:var(--bg);color:var(--txt);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:16px 14px 40px;max-width:640px}
h1{font:800 28px Georgia,serif;margin:4px 0 16px;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card>b{display:block;margin-bottom:6px;font:700 16px Georgia,serif}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0a120e;color:var(--txt);width:100%;margin:4px 0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--acc);color:#1a1400;font-weight:700;border:0;cursor:pointer;width:auto;padding:10px 18px}
button:active{transform:scale(.97)}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line);padding:6px 12px}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:5px 10px;font-size:13px}
button.del:hover{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow-x:auto}
.tabs button{background:transparent;color:var(--mut);border:0;border-bottom:3px solid transparent;border-radius:0;margin:0;padding:10px 14px;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:left}
td.n{font-weight:700}
td.p{font:800 18px Georgia,serif;color:var(--acc)}
tr.top{background:linear-gradient(90deg,rgba(242,193,78,.12),transparent)}
.pos{font-size:16px}
.m{display:grid;grid-template-columns:1fr 50px 12px 50px 1fr;gap:6px;align-items:center;padding:8px 0}
.m input{text-align:center;padding:8px;margin:0;font-weight:700}
.mc{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mc:last-child{border-bottom:0}
.mc .t{color:var(--mut)}
.mc .t:first-child{text-align:right}
.mc .t.w{color:var(--txt);font-weight:800}
.sb{background:#050a07;color:var(--acc);font:800 21px "Courier New",monospace;padding:4px 14px;border-radius:8px;border:1px solid var(--line);letter-spacing:2px}
.mc .meta{grid-column:1/-1;text-align:center;color:var(--mut);font-size:12px;margin-top:-4px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.mut{color:var(--mut);font-size:13px}
.err{color:var(--bad);min-height:18px}
.big{font:800 40px Georgia,serif;text-align:center;margin:10px 0 4px}
.f{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1.5px;background:var(--line)}
.f.G{background:var(--ok)}.f.M{background:var(--bad)}.f.B{background:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#0a120e;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--mut);display:block;font-size:12px}
.kpi b{font:800 19px Georgia,serif;display:block;margin:2px 0}
.kpi.wide{grid-column:1/-1}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0;background:var(--line)}
.bar .a{background:var(--ok)}.bar .d{background:var(--mut)}.bar .b{background:var(--acc)}
.hide{display:none}
</style>
</head>
<body>
<h1>⚽ FIFA Ligi</h1>

<div id="login" class="card hide">
  <input id="u" placeholder="Kullanıcı adı" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button onclick="giris()">Giriş yap</button>
</div>

<div id="app" class="hide">
  <div class="row" style="justify-content:space-between"><span class="mut">Giriş: <b id="me"></b></span><button class="sec" onclick="auth.signOut()">Çıkış</button></div>
  <div class="tabs" style="margin-top:10px">
    <button data-t="tab-tablo" class="on">Puan durumu</button>
    <button data-t="tab-mac">Maçlar</button>
    <button data-t="tab-analiz">Analiz</button>
    <button data-t="tab-h2h">İkili skor</button>
    <button data-t="tab-admin" id="adminTab" class="hide">Yönetim</button>
  </div>

  <div id="tab-tablo" class="card"></div>

  <div id="tab-mac" class="hide">
    <div class="card">
      <b>Maç ekle</b>
      <div class="m" style="border:0">
        <select id="hm" style="margin:0"></select>
        <input type="number" min="0" id="hg" placeholder="0">
        <div class="mut">-</div>
        <input type="number" min="0" id="ag" placeholder="0">
        <select id="aw" style="margin:0"></select>
      </div>
      <button onclick="macEkle()">Maçı kaydet</button>
    </div>
    <select id="filtre" onchange="maclar()"></select>
    <div class="card" id="maclist"></div>
  </div>

  <div id="tab-analiz" class="hide">
    <div class="card"><b>Ligin rekorları</b><div class="grid" id="rec"></div></div>
    <div class="card"><b>Oyuncu profili</b><select id="pa" onchange="analiz()"></select><div id="prof"></div></div>
  </div>

  <div id="tab-h2h" class="hide card">
    <div class="row"><select id="a" onchange="h2h()"></select><select id="b" onchange="h2h()"></select></div>
    <div id="h2hout"></div>
  </div>

  <div id="tab-admin" class="hide">
    <div class="card">
      <b>Oyuncu ekle</b>
      <input id="nn" placeholder="İsim (ör. Ahmet)">
      <input id="nu" placeholder="Kullanıcı adı (ör. ahmet)" autocapitalize="none">
      <input id="np" placeholder="Şifre (en az 6 karakter)">
      <div class="err" id="aerr"></div>
      <button onclick="oyuncuEkle()">Ekle</button>
    </div>
    <div class="card"><b>Oyuncular</b><div id="plist"></div></div>
    <div class="card"><b>Maçları yönet</b><div id="amac"></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== 1) BURAYA KENDİ FIREBASE AYARINI YAPIŞTIR ======
const cfg = {
  apiKey: "AIzaSyAECRoKo0GKxz8RbYUdhKZwUnSKG4MMGJQ",
  authDomain: "fifasonuc-c3ebc.firebaseapp.com",
  projectId: "fifasonuc-c3ebc",
  storageBucket: "fifasonuc-c3ebc.firebasestorage.app",
  messagingSenderId: "680418147917",
  appId: "1:680418147917:web:eed97d55522070126a6604"
};
// ========================================================
const ADMIN = "admin";               // admin kullanıcı adı
const DOM = "@fifa.local";
firebase.initializeApp(cfg);
const auth = firebase.auth(), db = firebase.firestore();
let players = [], matches = [], isAdmin = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm = u => (players.find(p => p.username === u) || {name: u}).name;

function giris(){
  $('lerr').textContent = '';
  const v = $('u').value.trim().toLowerCase().replace(/\s+/g, '');
  auth.signInWithEmailAndPassword(v.includes('@') ? v : v + DOM, $('p').value)
    .catch(e => $('lerr').textContent = 'Giriş olmadı (' + e.code + ')');
}

let unsub = [];
auth.onAuthStateChanged(user => {
  unsub.forEach(f => f()); unsub = [];
  $('login').classList.toggle('hide', !!user);
  $('app').classList.toggle('hide', !user);
  if(!user) return;
  const un = user.email.replace(DOM, '');
  isAdmin = un === ADMIN;
  $('me').textContent = un;
  $('adminTab').classList.toggle('hide', !isAdmin);
  unsub.push(db.collection('players').onSnapshot(s => { players = s.docs.map(d => d.data()).sort((a,b)=>a.name.localeCompare(b.name,'tr')); render(); }));
  unsub.push(db.collection('matches').onSnapshot(s => { matches = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }));
});

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['tab-tablo','tab-mac','tab-analiz','tab-h2h','tab-admin'].forEach(t => $(t).classList.toggle('hide', t !== b.dataset.t));
});

function render(){ tablo(); fill(); maclar(); analiz(); h2h(); admin(); }

function tablo(){
  const t = {};
  players.forEach(p => t[p.username] = {u:p.username,o:0,g:0,b:0,m:0,ag:0,yg:0});
  matches.filter(m => m.played && t[m.home] && t[m.away]).forEach(m => {
    const h = t[m.home], a = t[m.away];
    h.o++; a.o++; h.ag += m.hg; h.yg += m.ag; a.ag += m.ag; a.yg += m.hg;
    if(m.hg > m.ag){h.g++; a.m++} else if(m.hg < m.ag){a.g++; h.m++} else {h.b++; a.b++}
  });
  const rows = Object.values(t).map(r => ({...r, av:r.ag-r.yg, pu:r.g*3+r.b}))
    .sort((x,y) => y.pu-x.pu || y.av-x.av || y.ag-x.ag);
  $('tab-tablo').innerHTML = rows.length ? '<table><tr><th>#</th><th class="n">Oyuncu</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>Form</th><th>P</th></tr>' +
    rows.map((r,i) => `<tr class="${i==0&&r.o?'top':''}"><td class="pos">${r.o?(['🥇','🥈','🥉'][i]||i+1):i+1}</td><td class="n">${esc(nm(r.u))}</td><td>${r.o}</td><td>${r.g}</td><td>${r.b}</td><td>${r.m}</td><td>${r.av>0?'+':''}${r.av}</td><td>${form(r.u)}</td><td class="p">${r.pu}</td></tr>`).join('') + '</table>'
    : '<p class="mut">Henüz oyuncu yok. Admin olarak Yönetim sekmesinden ekle.</p>';
}

function fill(){
  const opts = players.map(p => `<option value="${p.username}">${esc(p.name)}</option>`).join('');
  const keep = id => { const v = $(id).value; return v; };
  const f = keep('filtre'), a = keep('a'), b = keep('b');
  $('filtre').innerHTML = '<option value="">Tüm maçlar</option><option value="_todo">Oynanmamışlar</option>' + opts;
  const hm = $('hm').value, aw = $('aw').value;
  $('hm').innerHTML = opts; $('aw').innerHTML = opts;
  $('filtre').value = f; if(a) $('a').value = a;
  if(hm) $('hm').value = hm;
  if(aw) $('aw').value = aw; else if(players[1]) $('aw').value = players[1].username;
  const pa = $('pa').value; $('pa').innerHTML = opts; if(pa) $('pa').value = pa;
  $('a').innerHTML = opts; $('b').innerHTML = opts;
  if(a) $('a').value = a;
  if(b) $('b').value = b; else if(players[1]) $('b').value = players[1].username;
}

function maclar(){
  const f = $('filtre').value;
  const l = matches.filter(m => m.played && (f === '' || m.home === f || m.away === f))
    .sort((x,y) => (y.ts||0) - (x.ts||0));
  $('maclist').innerHTML = l.length ? l.map(m => matchCard(m, false)).join('') : '<p class="mut">Henüz maç girilmedi.</p>';
}

function pm(u){
  return matches.filter(m => m.played && (m.home===u || m.away===u)).sort((x,y) => (x.ts||0)-(y.ts||0)).map(m => {
    const h = m.home === u, gf = h ? m.hg : m.ag, ga = h ? m.ag : m.hg;
    return {opp: h ? m.away : m.home, gf, ga, r: gf>ga ? 'G' : gf<ga ? 'M' : 'B'};
  });
}
function form(u){ return pm(u).slice(-5).map(x => `<i class="f ${x.r}"></i>`).join('') || '<span class="mut">-</span>'; }
function agg(){
  return players.map(p => {
    const l = pm(p.username); let g=0,b=0,m=0,gf=0,ga=0,ws=0,c=0;
    l.forEach(x => { gf+=x.gf; ga+=x.ga; if(x.r==='G'){g++; c++; ws=Math.max(ws,c)} else {c=0; x.r==='B' ? b++ : m++} });
    let cur=0; for(let i=l.length-1; i>=0 && l[i].r==='G'; i--) cur++;
    return {u:p.username,l,o:l.length,g,b,m,gf,ga,ws,cur};
  });
}
const kpi = (t,v,s,w) => `<div class="kpi ${w?'wide':''}"><small>${t}</small><b>${v}</b><small>${s||''}</small></div>`;
function analiz(){
  const all = agg(), A = all.filter(x => x.o), pl = matches.filter(m => m.played);
  if(!A.length){ $('rec').innerHTML = '<p class="mut">Maç girildikçe rekorlar burada çıkar.</p>'; $('prof').innerHTML=''; return; }
  const best = (f,asc) => A.slice().sort((x,y) => asc ? f(x)-f(y) : f(y)-f(x))[0];
  const gk = best(x=>x.gf), sv = best(x=>x.ga/x.o,true), wp = best(x=>x.g/x.o), ws = best(x=>x.ws);
  const bw = pl.slice().sort((x,y) => Math.abs(y.hg-y.ag)-Math.abs(x.hg-x.ag))[0];
  const hs = pl.slice().sort((x,y) => (y.hg+y.ag)-(x.hg+x.ag))[0];
  const sc = m => `${esc(nm(m.home))} ${m.hg}-${m.ag} ${esc(nm(m.away))}`;
  $('rec').innerHTML =
    kpi('Gol kralı', esc(nm(gk.u)), gk.gf+' gol') +
    kpi('En az yiyen', esc(nm(sv.u)), (sv.ga/sv.o).toFixed(1)+' gol/maç') +
    kpi('Kazanma oranı', esc(nm(wp.u)), '%'+Math.round(wp.g/wp.o*100)) +
    kpi('En uzun seri', esc(nm(ws.u)), ws.ws+' galibiyet') +
    kpi('En farklı skor', sc(bw), '', true) + kpi('En çok gollü maç', sc(hs), (hs.hg+hs.ag)+' gol', true);
  const x = all.find(y => y.u === $('pa').value);
  if(!x || !x.o){ $('prof').innerHTML = '<p class="mut">Bu oyuncu henüz maç yapmadı.</p>'; return; }
  const r = {}; x.l.forEach(y => { const q = r[y.opp] = r[y.opp] || {w:0,l:0}; y.r==='G' ? q.w++ : y.r==='M' && q.l++; });
  const ks = Object.entries(r), kurban = ks.sort((a,b) => (b[1].w-b[1].l)-(a[1].w-a[1].l))[0], bela = ks.sort((a,b) => (b[1].l-b[1].w)-(a[1].l-a[1].w))[0];
  $('prof').innerHTML = `<div class="grid" style="margin-top:8px">` +
    kpi('Maç', x.o, `${x.g}G ${x.b}B ${x.m}M`) + kpi('Kazanma', '%'+Math.round(x.g/x.o*100), 'puan/maç '+((x.g*3+x.b)/x.o).toFixed(2)) +
    kpi('Attığı', (x.gf/x.o).toFixed(1), 'gol/maç') + kpi('Yediği', (x.ga/x.o).toFixed(1), 'gol/maç') +
    kpi('En uzun seri', x.ws, 'galibiyet') + kpi('Güncel seri', x.cur, 'galibiyet') +
    kpi('Son 5 maç', form(x.u), '', true) +
    (kurban[1].w > kurban[1].l ? kpi('Favori kurbanı', esc(nm(kurban[0])), kurban[1].w+'-'+kurban[1].l+' önde', true) : '') +
    (bela[1].l > bela[1].w ? kpi('Baş belası', esc(nm(bela[0])), bela[1].l+'-'+bela[1].w+' geride', true) : '') + `</div>`;
}

function matchCard(m, del){
  const d = m.ts ? new Date(m.ts).toLocaleDateString('tr-TR', {day:'numeric', month:'short'}) : '';
  return `<div class="mc">
    <div class="t ${m.hg>m.ag?'w':''}">${esc(nm(m.home))}</div>
    <div class="sb">${m.hg}-${m.ag}</div>
    <div class="t ${m.ag>m.hg?'w':''}">${esc(nm(m.away))}</div>
    <div class="meta">${d} · ${esc(m.by||'')}${del?` · <button class="del" onclick="macSil('${m.id}')">Sil</button>`:''}</div>
  </div>`;
}

function macEkle(){
  const home = $('hm').value, away = $('aw').value;
  const hg = parseInt($('hg').value), ag = parseInt($('ag').value);
  if(!home || !away) return alert('Önce admin oyuncu eklemeli.');
  if(home === away) return alert('İki farklı oyuncu seç.');
  if(isNaN(hg) || isNaN(ag) || hg < 0 || ag < 0) return alert('İki skoru da gir.');
  db.collection('matches').add({home, away, hg, ag, played:true, by:$('me').textContent, ts:Date.now()})
    .then(() => { $('hg').value = $('ag').value = ''; })
    .catch(e => alert('Kaydedilemedi: ' + e.message));
}

function macSil(id){
  if(confirm('Bu maç silinsin mi?')) db.collection('matches').doc(id).delete();
}

function h2h(){
  const a = $('a').value, b = $('b').value;
  if(!a || !b) return;
  if(a === b){ $('h2hout').innerHTML = '<p class="mut">İki farklı oyuncu seç.</p>'; return; }
  let wa = 0, wb = 0, d = 0, ga = 0, gb = 0, n = 0;
  matches.filter(m => m.played && ((m.home===a&&m.away===b)||(m.home===b&&m.away===a))).forEach(m => {
    const sa = m.home === a ? m.hg : m.ag, sb = m.home === a ? m.ag : m.hg;
    n++; ga += sa; gb += sb;
    if(sa > sb) wa++; else if(sa < sb) wb++; else d++;
  });
  $('h2hout').innerHTML = n ? `<div class="big">${wa} - ${wb}</div><div class="bar"><span class="a" style="flex:${wa||.01}"></span><span class="d" style="flex:${d||.01}"></span><span class="b" style="flex:${wb||.01}"></span></div>
    <p style="text-align:center">${esc(nm(a))} <b>${wa}</b> kez yendi, ${esc(nm(b))} <b>${wb}</b> kez yendi, ${d} beraberlik.<br>
    <span class="mut">Toplam gol: ${ga} - ${gb} (${n} maç)</span></p>`
    : '<p class="mut">Bu ikili henüz maç oynamadı.</p>';
  if(n) $('h2hout').innerHTML += matches.filter(m => m.played && ((m.home===a&&m.away===b)||(m.home===b&&m.away===a))).sort((x,y)=>(y.ts||0)-(x.ts||0)).map(m => matchCard(m,false)).join('');
}

function admin(){
  if(!isAdmin) return;
  $('amac').innerHTML = matches.filter(m => m.played).sort((x,y) => (y.ts||0)-(x.ts||0)).map(m => matchCard(m, true)).join('') || '<span class="mut">Maç yok</span>';
  $('plist').innerHTML = players.map(p => `<div class="pl">
    <span>${esc(p.name)} <span class="mut">(${esc(p.username)})</span></span>
    <button class="del" onclick="sil('${p.username}')">Sil</button></div>`).join('') || '<span class="mut">Boş</span>';
}

async function oyuncuEkle(){
  const name = $('nn').value.trim(), u = $('nu').value.trim().toLowerCase(), pw = $('np').value;
  $('aerr').textContent = '';
  if(!name || !/^[a-z0-9_]+$/.test(u) || pw.length < 6) return $('aerr').textContent = 'İsim, kullanıcı adı (harf/rakam) ve 6+ karakter şifre gerekli.';
  try{
    // admin oturumu kapanmasın diye ikinci bir uygulama örneği kullanılıyor
    const sec = firebase.apps.find(x => x.name === 'sec') || firebase.initializeApp(cfg, 'sec');
    await sec.auth().createUserWithEmailAndPassword(u + DOM, pw);
    await sec.auth().signOut();
    await db.collection('players').doc(u).set({name, username:u});
    $('nn').value = $('nu').value = $('np').value = '';
  }catch(e){ $('aerr').textContent = 'Hata: ' + e.message; }
}

async function sil(u){
  if(!confirm(nm(u) + ' ve maçları silinsin mi? (Giriş hesabını Firebase panelinden de silebilirsin.)')) return;
  const batch = db.batch();
  batch.delete(db.collection('players').doc(u));
  matches.filter(m => m.home === u || m.away === u).forEach(m => batch.delete(db.collection('matches').doc(m.id)));
  await batch.commit();
}
</script>
</body>
</html>
